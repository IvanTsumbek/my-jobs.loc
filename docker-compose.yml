services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - ./:/var/www
    working_dir: /var/www

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8
    container_name: laravel_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_jobs.loc
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: laravel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_horizon
    volumes:
      - ./:/var/www
    working_dir: /var/www
    command: php artisan horizon
    depends_on:
      - app
      - redis
      - mysql

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_scheduler
    volumes:
      - ./:/var/www
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - app
      - redis
      - mysql

volumes:
  mysql_data:
  redis_data: