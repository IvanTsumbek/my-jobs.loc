services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - ./:/var/www
    working_dir: /var/www

  mysql:
    image: mysql:8
    container_name: laravel_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_jobs.loc
    ports:
      - "3307:3306"
  redis:
    image: redis:7
    container_name: laravel_redis
    ports:
      - "6379:6379"

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_horizon
    volumes:
      - ./:/var/www
    working_dir: /var/www
    command: php artisan horizon
    depends_on:
      - app
      - redis
      - mysql